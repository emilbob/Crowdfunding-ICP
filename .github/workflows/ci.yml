name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Azle's postinstall shells out to dfx. The typecheck does not need a
      # canister build, so skip scripts here and keep this job fast; the
      # build-and-test job below covers the real install path.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

      # The frontend is deliberately NOT typechecked here. It imports dfx's
      # generated Candid bindings, which need dfx to produce — and installing
      # dfx would make this job as slow as the one below. build-and-test
      # typechecks it anyway: the frontend's build script is `tsc -b && vite
      # build`, so a type error fails that job.

  # Mirrors exactly what Vercel does: install ONLY frontend/, then build the
  # demo. The other jobs run a root `npm ci` first, so anything the frontend
  # resolves from the root node_modules — @types/node was the one that bit —
  # looks fine there and fails on Vercel. This job has no root install on
  # purpose; do not add one.
  demo-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build:demo

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dfx
        run: |
          curl -fsSL https://internetcomputer.org/install.sh -o /tmp/install-dfx.sh
          DFXVM_INIT_YES=true sh /tmp/install-dfx.sh
          # dfxvm's install location differs by platform; add whichever exists.
          # Note the `if` rather than `[ -d ... ] &&`: these steps run under
          # `bash -e`, so a false test as the last command fails the step.
          for d in "$HOME/.local/share/dfx/bin" "$HOME/Library/Application Support/org.dfinity.dfx/bin"; do
            if [ -d "$d" ]; then
              echo "$d" >> "$GITHUB_PATH"
            fi
          done

      - name: Verify dfx is on PATH
        run: dfx --version

      - run: npm ci

      # dfx.json references these wasms, so fetch them before any dfx command.
      - name: Fetch local third-party canisters
        run: bash scripts/setup-local-canisters.sh

      - name: Start local replica
        run: dfx start --background --clean

      - name: Build canister
        run: |
          dfx canister create crowdfund
          dfx build crowdfund

      # The generated Candid bindings are committed, because builds without dfx
      # (the static demo, and its Pages workflow) import them statically and
      # cannot produce them. Regenerating and diffing here is what stops the
      # committed copy drifting from the canister. `dfx build` does not produce
      # them — only `dfx generate` does.
      - name: Candid bindings are up to date
        run: |
          dfx generate crowdfund
          git diff --exit-code -- src/declarations || {
            echo "::error::src/declarations is stale — run 'dfx generate crowdfund' and commit the result"
            exit 1
          }

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Build static demo
        run: npm --prefix frontend run build:demo

      - name: End-to-end tests against a real ICRC ledger
        run: npm run test:e2e

      - name: Stop local replica
        if: always()
        run: dfx stop || true
